metadata:
  name: fluent-bit
  namespace: logging
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
        sealedsecrets.bitnami.com/skip-set-owner-references: "true"
      labels:
        app.kubernetes.io/part-of: fluent-bit
      name: fluent-bit
      namespace: logging
    type: Opaque

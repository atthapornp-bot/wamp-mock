apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: external-api
  namespace: wamp-training
spec:
  # Define the HTTP rules for this route
  http:
    - name: external-api-training
      # Match requests to this path pattern
      match:
        hosts:
          - "wamp-gw-nonprod.muangthai.co.th"
          - "oapi-uat.dev.muangthai.co.th"
        paths:
          - /training/api/v1/external/confirm-quotation
          - /training/api/v1/external/get-quotation
          - /training/api/v1/external/reference-code
        methods:
          - POST
          

      # Where to send authenticated requests
      backends:
        - serviceName: wamp-external-api
          servicePort: 80
          weight: 100

      # Reference to comprehensive error handling plugin configuration
      plugin_config_name: global-plugin-training
 
      # Additional plugins that apply to this route
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/training/api/v1/external(?:/(.*))?/?$", "/v1/$1"]

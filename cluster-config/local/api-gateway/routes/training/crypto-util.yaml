apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: crypto-util
  namespace: wamp-training
spec:
  # Define the HTTP rules for this route
  http:
    - name: crypto-util-training
      # Match requests to this path pattern
      match:
        hosts:
          - "wamp-gw-nonprod.muangthai.co.th"
        paths:
          - /training/api/v1/crypto
          - /training/api/v1/crypto/*
        methods:
          - POST

      # Where to send authenticated requests
      backends:
        - serviceName: wamp-crypto-util
          servicePort: 80
          weight: 100

      # Reference to comprehensive error handling plugin configuration
      plugin_config_name: global-plugin-training

      # Additional plugins that apply to this route
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/training/api/v1/crypto(?:/(.*))?/?$", "/v1/$1"]

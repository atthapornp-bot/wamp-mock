apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: external-api-health-check
  namespace: wamp-sit
spec:
  # Define the HTTP rules for this health check route
  http:
    - name: external-api-health-check-sit
      # Match requests to the health check path
      match:
        hosts:
          - "wamp-gw-nonprod.muangthai.co.th"
        paths:
          - /sit/api/v1/external/health-check/livez
          - /sit/api/v1/external/health-check/readyz
        methods:
          - GET
          
      # Where to send health check requests
      backends:
        - serviceName: wamp-external-api
          servicePort: 80
          weight: 100

      # Reference to comprehensive error handling plugin configuration
      plugin_config_name: global-plugin

      # Additional plugins that apply to this route
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/sit/api/v1/external/health-check/(.*)$", "/health-check/$1"]
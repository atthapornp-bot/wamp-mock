apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: global-plugin
  namespace: wamp-sit
  labels:
    app: apisix
spec:
  plugins:
    # Generate request ID first (default priority: 12015)
    - name: request-id
      enable: true
      config:
        include_in_response: true
        header_name: "X-Request-ID"
        algorithm: "uuid"

    # Request validation (default priority: 2999)
    - name: request-validation
      enable: true
      config:
        header_schema:
          type: object
          properties:
            X-API-KEY:
              type: string
              minLength: 10
              pattern: "^[A-Za-z0-9_-]+$"
          required: ["X-API-KEY"]
        body_schema:
          type: object

    # Rate limiting (default priority: 1002)
    - name: limit-count
      enable: true
      config:
        count: 10000
        time_window: 3600
        rejected_code: 429
        rejected_msg: "Route-specific rate limit exceeded"
        policy: "local"

    # Consumer restriction (default priority: 2400)
    - name: consumer-restriction
      enable: true
      config:
        whitelist: # Naming does not allow hyphen (-) in the name, it needs to be replaced with underscore (_)
          - "apisix_system_api_client_mtl_sit"
          - "apisix_system_api_client_kx_sit"
          - "apisix_system_api_client_dataservice_sit"
          - "apisix_system_api_client_oapi_sit"

    # Key authentication (default priority: 1000)
    - name: key-auth
      enable: true
      config:
        # The header where the API key should be provided
        # Clients will send: X-API-Key: <your-api-key>
        header: X-API-KEY

    # # Header filter - This runs AFTER the response status is set
    # # Even if consumer-restriction calls ngx.exit(), this phase still runs
    - name: serverless-post-function
      enable: true
      config:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              if ngx.status >= 400 then
                local core = require("apisix.core")
                core.response.clear_header_as_body_modified()
                ngx.header["Content-Type"] = "application/json"
              end
            end

    # Body filter - This runs when the response body is being sent
    # We'll completely replace the body with our formatted error
    - name: serverless-post-function
      enable: true
      config:
        phase: body_filter
        functions:
          - |
            return function(conf, ctx)
              if ngx.status >= 400 then
                local cjson = require('cjson')
                local core = require('apisix.core')
                local body = core.response.hold_body_chunk(ctx)
                
                if not body then
                  return
                end

                -- Map status codes to error names
                local status_map = {
                  [400] = "Bad_Request",
                  [401] = "Unauthorized",
                  [403] = "Forbidden",
                  [404] = "Not_Found",
                  [405] = "Method_Not_Allowed",
                  [408] = "Request_Timeout",
                  [409] = "Conflict",
                  [410] = "Gone",
                  [411] = "Length_Required",
                  [412] = "Precondition_Failed",
                  [413] = "Payload_Too_Large",
                  [414] = "URI_Too_Long",
                  [415] = "Unsupported_Media_Type",
                  [422] = "Unprocessable_Entity",
                  [429] = "Too_Many_Requests",
                  [500] = "Internal_Server_Error",
                  [501] = "Not_Implemented",
                  [502] = "Bad_Gateway",
                  [503] = "Service_Unavailable",
                  [504] = "Gateway_Timeout",
                  [505] = "HTTP_Version_Not_Supported"
                }
                
                local error_name = status_map[ngx.status] or "Error"
                
                -- Determine the error message based on the status and context
                local error_message = "An error occurred"
                
                -- Check for specific error scenarios
                if ngx.status == 400 then
                  -- Check if it's from request-validation
                  if string.find(body, "property") or string.find(body, "schema") or string.find(body, "validation") then
                    error_message = "Invalid request data or headers"
                  else
                    error_message = "Bad Request"
                  end
                elseif ngx.status == 401 then
                  -- Authentication errors
                  if string.find(body, "API") or string.find(body, "key") or string.find(body, "auth") then
                    error_message = "Invalid API Key"
                  else
                    error_message = "Authentication required"
                  end
                elseif ngx.status == 403 then
                  -- Consumer restriction or forbidden
                  if string.find(body, "consumer") or string.find(body, "restriction") then
                    error_message = "Invalid API Key"
                  else
                    error_message = "Access forbidden"
                  end
                elseif ngx.status == 429 then
                  error_message = "Rate limit exceeded"
                elseif ngx.status == 500 then
                  error_message = "Internal server error"
                elseif ngx.status == 502 then
                  error_message = "Bad gateway"
                elseif ngx.status == 503 then
                  error_message = "Service unavailable"
                elseif ngx.status == 504 then
                  error_message = "Gateway timeout"
                else
                  -- Try to extract message from original body
                  local decoded_body
                  local success = pcall(function()
                    decoded_body = cjson.decode(body)
                  end)
                  
                  if success and decoded_body then
                    if decoded_body.message then
                      error_message = decoded_body.message
                    elseif decoded_body.error and type(decoded_body.error) == "string" then
                      error_message = decoded_body.error
                    elseif decoded_body.error and decoded_body.error.message then
                      error_message = decoded_body.error.message
                    end
                  end
                end
                
                -- Create the standardized error response
                local response_body = cjson.encode({
                  error = error_name,
                  message = error_message
                })
                
                -- Replace the body with our formatted error
                ngx.arg[1] = response_body
                ngx.arg[2] = true
              end
            end

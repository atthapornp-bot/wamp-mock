apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: global-plugin
  namespace: wamp-sit
  labels:
    app: apisix
spec:
  plugins:
    # Generate request ID first (default priority: 12015)
    - name: request-id
      enable: true
      config:
        include_in_response: true
        header_name: "X-Request-ID"
        algorithm: "uuid"

    # Request validation (default priority: 2999)
    # - name: request-validation
    #   enable: true
    #   config:
    #     _meta:
    #       error_response:
    #         error:
    #           # shouldOverride: true
    #           code: 400
    #           errorMessageTH: "ข้อมูล หรือ headers ที่ส่งมาไม่ถูกต้อง"
    #           errorMessageEN: "Invalid request data or headers"
    #     header_schema:
    #       type: object
    #       properties:
    #         X-API-KEY:
    #           type: string
    #           minLength: 10
    #           pattern: "^[A-Za-z0-9_-]+$"
    #       required: ["X-API-KEY"]
    #     body_schema:
    #       type: object

    # Rate limiting (default priority: 1002)
    - name: limit-count
      enable: true
      config:
        _meta:
          error_response:
            error:
              # shouldOverride: true
              code: 429
              errorMessageTH: "การจำกัดอัตราการเรียกใช้งานเกินขีดจำกัด"
              errorMessageEN: "Rate limit exceeded"
        count: 10000
        time_window: 3600
        rejected_code: 429
        rejected_msg: "Route-specific rate limit exceeded"
        policy: "local"

    # Consumer restriction (default priority: 2400)
    - name: consumer-restriction
      enable: true
      config:
        _meta:
          error_response:
            error:
              # shouldOverride: true
              code: 401
              errorMessageTH: "API Key ไม่ถูกต้อง"
              errorMessageEN: "Invalid API Key"
        whitelist: # Naming does not allow hyphen (-) in the name, it needs to be replaced with underscore (_)
          - "apisix_system_api_client_mtl_sit"
          - "apisix_system_api_client_kx_sit"
          - "apisix_system_api_client_dataservice_sit"
          - "apisix_system_api_client_oapi_sit"

    # Key authentication (default priority: 1000)
    - name: key-auth
      enable: true
      config:
        _meta:
          error_response:
            error:
              # shouldOverride: true
              code: 401
              errorMessageTH: "API Key ไม่ถูกต้อง"
              errorMessageEN: "Invalid API Key"
        # The header where the API key should be provided
        # Clients will send: X-API-Key: <your-api-key>
        header: X-API-KEY


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wamp-services-alb
  namespace: ingress-nginx
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/group.name: "wamp-alb-shared-group"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:ap-southeast-1:390844743995:regional/webacl/dev-wamp-web-acl/b4a477a6-9663-462f-b4b0-9edaf906014a"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "10254"
    alb.ingress.kubernetes.io/healthcheck-path: "/healthz"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-southeast-1:390844743995:certificate/64fb39cd-70d3-44bc-adaa-7fb6eb6e09ef"
    # List of CIDR blocks to allow traffic from Cloudflare only
    alb.ingress.kubernetes.io/inbound-cidrs: |
      173.245.48.0/20,
      103.21.244.0/22,
      103.22.200.0/22,
      103.31.4.0/22,
      141.101.64.0/18,
      108.162.192.0/18,
      190.93.240.0/20,
      188.114.96.0/20,
      197.234.240.0/22,
      198.41.128.0/17,
      162.158.0.0/15,
      104.16.0.0/13,
      104.24.0.0/14,
      172.64.0.0/13,
      131.0.72.0/22
    # Log ALB access to S3
    alb.ingress.kubernetes.io/access-logs.s3.enabled: "true"
    alb.ingress.kubernetes.io/access-logs.s3.bucket: "dev-wamp-alb-logs-bucket"
    alb.ingress.kubernetes.io/access-logs.s3.prefix: "wamp"
    # Enable deletion protection on the ALB
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true
spec:
  rules:
    - host: "*.muangthai.co.th"
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: ingress-nginx-controller  # The Nginx Ingress Controller Service
                port:
                  number: 80


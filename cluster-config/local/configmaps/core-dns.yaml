apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
          }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
    gitmtl.muangthai.co.th:53 {
        errors
        hosts {
          10.200.51.101 gitmtl.muangthai.co.th
        }
    }
    registry.muangthai.co.th:53 {
        errors
        hosts {
          10.200.51.101 registry.muangthai.co.th
        }
    }
    mailgateway.muangthai.co.th:53 {
        errors
        hosts {
          10.200.7.18 mailgateway.muangthai.co.th
        }
    }
    mtlgw-uat.muangthai.co.th:53 {
        errors
        hosts {
          10.200.11.61 mtlgw-uat.muangthai.co.th
        }
    }
    gateway-uat.muangthai.co.th:53 {
        errors
        hosts {
          10.200.11.44 gateway-uat.muangthai.co.th
        }
    }
    github.com:53 {
        errors
        hosts {
          120.205.243.166 github.com
        }
    }
    k-proposal-uat.muangthai.co.th:53 {
        errors
        hosts {
          192.168.77.56 k-proposal-uat.muangthai.co.th
          10.200.1.17 k-proposal-uat.muangthai.co.th
        }
    }

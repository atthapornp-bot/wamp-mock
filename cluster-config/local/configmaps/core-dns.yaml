apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
          }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
    gitmtl.muangthai.co.th:53 {
        errors
        hosts {
          10.200.51.101 gitmtl.muangthai.co.th
        }
    }
    registry.muangthai.co.th:53 {
        errors
        hosts {
          10.200.51.101 registry.muangthai.co.th
        }
    }
    mailgateway.muangthai.co.th:53 {

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-ops
  namespace: argo-cd
spec:
  description: Cluster Ops

  sourceRepos:
    - "*"

  destinations:
    - name: "*"
      namespace: "*"
      server: "*"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: false

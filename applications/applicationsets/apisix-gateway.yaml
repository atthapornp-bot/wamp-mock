apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apisix-gateway
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: local
            server: https://kubernetes.default.svc
            clusterName: wamp-nonprod
            awsRegion: ap-southeast-1

  template:
    metadata:
      name: "{{name}}-apisix-gateway"

    spec:
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

      project: cluster-ops

      destination:
        namespace: "apisix-system"
        server: "{{server}}"

      source:
        repoURL: https://charts.apiseven.com
        chart: apisix
        targetRevision: 2.10.0

        # hhttps://github.com/apache/apisix-helm-chart/blob/master/charts/apisix/values.yaml
        helm:
          values: |
            # Core APISIX Configuration
            # This configures APISIX as an API Gateway that will receive traffic from ALB
            # and forward processed requests to ingress-nginx-controller
            apisix:
              # Admin API for dynamic configuration
              admin:
                enabled: true
                port: 9180
                # Allow admin access from within the cluster
                allow_admin:
                  - 172.16.0.0/16  # Internal cluster CIDR
                  - 192.168.0.0/16 # MTL VPN CIDR block

              # Router configuration optimized for performance
              router:
                http: 'radixtree_uri'  # Fast URI matching algorithm

              # Essential plugins for API Gateway functionality
              # We're being selective here - only enabling plugins we'll actually use
              # This improves performance compared to enabling everything
              # Priority references are from APISIX 1.x ingress-controller template:
              # https://github.com/apache/apisix-helm-chart/blob/apisix/1.x/charts/apisix-ingress-controller/templates/apisix-configmap.yaml#L79
              plugins:
                # Authentication & Authorization
                - key-auth           # API key authentication (priority: 2500)
                - jwt-auth           # JWT token validation (priority: 2510)
                - basic-auth         # Basic HTTP authentication (priority: 2520)
                - consumer-restriction # Restrict access to specific consumers (priority: 2400)

                # Traffic Control & Security
                - limit-count        # Rate limiting (requests per time window) (priority: 1002)
                - limit-conn         # Connection limiting (priority: 1003)
                - ip-restriction     # IP allowlist/blocklist (priority: 3000)
                - cors               # Cross-origin resource sharing (priority: 4000)

                # Request/Response Transformation
                - proxy-rewrite      # Header and URI modification (priority: 1008)
                - request-validation # Request schema validation (priority: 2800)
                - response-rewrite   # Response transformation (priority: 899)
                - echo               # Echo plugin for health checks and testing (priority: 412)
                - serverless-pre-function # Custom Lua functions for dynamic responses (priority: 10000)
                - serverless-post-function # Custom Lua functions for dynamic responses (priority: -2000)

                # Observability & Logging
                - prometheus         # Metrics collection (priority: 500)
                - http-logger        # HTTP access logging (priority: 410)
                - loki-logger        # Loki logging for structured log storage (priority: 414)
                - request-id         # Request tracking (priority: 12015)
                - opentelemetry      # Distributed tracing (priority: 12009)
                - datadog            # Datadog APM/tracing (priority: 495)

                # Advanced Features
                - proxy-cache        # Response caching (priority: 1009)
                - traffic-split      # A/B testing and canary deployments (priority: 966)
                - fault-injection    # Chaos engineering support (priority: 11000)

              # Plugin attributes for configured observability plugins
              pluginAttrs:
                datadog:
                  enable: true
                  host: datadog.datadog.svc.cluster.local
                  port: 8126
                  namespace: apisix-system
                opentelemetry:
                  enable: true
                  resource:
                    service.name: apisix
                    env: nonprod
                    version: 0.1.0
                  collector:
                    address: http://datadog.datadog.svc.cluster.local:4318
                    request_timeout: 3
                  set_ngx_var: true

            # CRITICAL: Disable the ingress controller
            # This is the key change that resolves the architectural conflict
            # We want APISIX as a gateway, not as an ingress controller replacement
            ingress-controller:
              enabled: true
              config:
                apisix:
                  adminAPIVersion: "v3"
                  serviceName: local-apisix-gateway-admin
                  serviceNamespace: apisix-system
                  servicePort: 9180

            # Service Configuration
            # We use ClusterIP here because ALB will target this service internally
            # This creates a clean separation: ALB handles external load balancing,
            # APISIX handles API gateway concerns
            gateway:
              type: ClusterIP
              http:
                enabled: true
                servicePort: 80
                containerPort: 9080
              https:
                enabled: true
                servicePort: 443
                containerPort: 9443
              # Admin API service (for configuration management)
              admin:
                enabled: true
                servicePort: 9180
                containerPort: 9180


            # etcd Configuration for APISIX state storage
            # This is where APISIX stores its routing rules and plugin configurations
            etcd:
              enabled: true
              image:
                registry: docker.io
                repository: bitnamilegacy/etcd
              replicaCount: 3
              auth:
                rbac:
                  create: false
                  enabled: false  # Simplified for internal cluster use
                token:
                  enabled: true
                  type: jwt
                  privateKey:
                    existingSecret: apisix-gateway-etcd-jwt-token
                    filename: jwt-token.pem
              persistence:
                enabled: true
                storageClass: "database-gp3"
                size: 8Gi
              resources:
                limits:
                  memory: "1Gi"
                  cpu: "500m"
                requests:
                  memory: "512Mi"
                  cpu: "250m"

            # Resource allocation
            # Sized appropriately for API gateway workload
            replicaCount: 2

            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi

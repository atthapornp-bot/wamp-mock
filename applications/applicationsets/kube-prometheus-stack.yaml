apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: local
            server: https://kubernetes.default.svc
            clusterName: wamp-prod
            awsRegion: ap-southeast-1

  template:
    metadata:
      name: "{{name}}-kube-prometheus-stack"

    spec:
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

      project: cluster-ops

      destination:
        namespace: kube-prometheus-stack
        server: "{{server}}"

      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            - .webhooks[]?.failurePolicy
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
            - .webhooks[]?.failurePolicy

      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 62.7.0 # Always sync version with kube-prometheus-stack-crds
        helm:
          skipCrds: true # Workaround for CRDs annotation too long issues by separating Application and Replace=true
          releaseName: kube-prometheus-stack

          parameters:
            ## Grafana Ingress configuration
            - name: grafana.ingress.enabled
              value: "false"
            - name: grafana.ingress.hosts[0]
              value: grafana.{{values.baseDomain}}
            - name: grafana.ingress.tls[0].hosts[0]
              value: grafana.{{values.baseDomain}}

            ## Prometheus Volume
            # - name: prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.metadata.name
            #   value: prometheus
            # - name: prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage
            #   value: 10Gi

          values: |
            ## https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

            ## Provide a name to substitute for the full names of resources
            # fullnameOverride: "kube-prometheus-stack"

            ## Create default rules for monitoring the cluster
            defaultRules:
              create: true
              rules:
                etcd: false
                kubeScheduler: false

            ## Configuration for alertmanager
            ## ref: https://prometheus.io/docs/alerting/alertmanager/
            alertmanager:
              enabled: true

              ## Settings affecting alertmanagerSpec
              ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#alertmanagerspec
              alertmanagerSpec:
                ## Assign custom affinity rules to the alertmanager instance
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                          - key: kubernetes.io/os
                            operator: In
                            values:
                              - linux
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 3
                        preference:
                          matchExpressions:
                            - key: project
                              operator: In
                              values:
                                - cluster-ops
                      - weight: 2
                        preference:
                          matchExpressions:
                            - key: environment
                              operator: In
                              values:
                                - critical
                      - weight: 1
                        preference:
                          matchExpressions:
                            - key: eks.amazonaws.com/capacityType
                              operator: In
                              values:
                                - ON_DEMAND

            ## Using default values from https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
            grafana:
              enabled: true

              ## Pod Annotations
              podAnnotations:
                fluentbit.io/exclude: "true"

              ## Other options are: browser or a specific timezone, i.e. Europe/Luxembourg
              defaultDashboardsTimezone: Asia/Bangkok

              ## Administrator credentials when not using an existing secret (see below)
              # adminPassword: prom-operator

              ## Use an existing secret for the admin user.
              admin:
                existingSecret: kube-prometheus-stack-grafana
                userKey: admin-user
                passwordKey: admin-password

              replicas: 1

              # persistence:
              #   accessModes:
              #     - ReadWriteOnce
              #   enabled: true
              #   size: 5Gi

              ingress:
                enabled: true
                ingressClassName: nginx
                annotations:
                  kubernetes.io/tls-acme: "true"
                hosts:
                  - grafana.local
                path: /
                pathType: Prefix
                tls:
                  - secretName: grafana-general-tls
                    hosts:
                      - grafana.local

              ## Service configuration
              service:
                type: LoadBalancer
                annotations:
                  service.beta.kubernetes.io/aws-load-balancer-type: external
                  service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                  service.beta.kubernetes.io/aws-load-balancer-scheme: internal
                  service.beta.kubernetes.io/aws-load-balancer-subnets: dev-salestool-subnet-tgw-ap-southeast-1a, dev-salestool-subnet-tgw-ap-southeast-1b
                ports:
                  - port: 443
                    targetPort: 3000
                    protocol: TCP
                    name: https

            kubeApiServer:
              enabled: true

            kubelet:
              enabled: true

              serviceMonitor:
                ## Lens: To see cluster's pod usage on cluster overview properly
                ## https://github.com/lensapp/lens/blob/master/troubleshooting/custom-prometheus.md
                metricRelabelings:
                  - action: replace
                    sourceLabels:
                      - node
                    targetLabel: instance

            kubeControllerManager:
              enabled: true

            coreDns:
              enabled: true

            kubeEtcd:
              enabled: false # Disable in case of stealth control-plane (EKS, GKE, DOKS)

            kubeScheduler:
              enabled: false # Disable in case of stealth control-plane (EKS, GKE, DOKS)

            kubeProxy:
              enabled: true

            kubeStateMetrics:
              enabled: true

            ## Deploy node exporter as a daemonset to all nodes
            nodeExporter:
              enabled: true

            ## Configuration for prometheus-node-exporter subchart
            ##
            prometheus-node-exporter:
              prometheus:
                monitor:
                  enabled: true

                  ## Lens: To see node metrics properly
                  ## https://github.com/lensapp/lens/blob/master/troubleshooting/custom-prometheus.md
                  relabelings:
                    - action: replace
                      regex: (.*)
                      replacement: $1
                      sourceLabels:
                        - __meta_kubernetes_pod_node_name
                      targetLabel: kubernetes_node

            ## Manages Prometheus and Alertmanager components
            prometheusOperator:
              enabled: true

              ## Assign custom affinity rules to the prometheus operator
              ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                        - key: kubernetes.io/os
                          operator: In
                          values:
                            - linux
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 3
                      preference:
                        matchExpressions:
                          - key: project
                            operator: In
                            values:
                              - cluster-ops
                    - weight: 2
                      preference:
                        matchExpressions:
                          - key: environment
                            operator: In
                            values:
                              - critical
                    - weight: 1
                      preference:
                        matchExpressions:
                          - key: eks.amazonaws.com/capacityType
                            operator: In
                            values:
                              - ON_DEMAND

            ## Deploy a Prometheus instance
            prometheus:
              enabled: true

              ## Annotations for Prometheus
              annotations:
                fluentbit.io/exclude: "true"

              ## Settings affecting prometheusSpec
              ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#prometheusspec
              prometheusSpec:

                ## Discover, See https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md
                ruleNamespaceSelector: {}
                ruleSelectorNilUsesHelmValues: true
                ruleSelector: {}

                serviceMonitorSelectorNilUsesHelmValues: true
                serviceMonitorSelector: {}
                serviceMonitorNamespaceSelector: {}

                podMonitorSelectorNilUsesHelmValues: true
                podMonitorSelector: {}
                podMonitorNamespaceSelector: {}

                probeSelectorNilUsesHelmValues: true
                probeNamespaceSelector: {}

                ## How long to retain metrics / Maximum size of metrics
                retention: 10d
                retentionSize: ""

                ## Number of replicas of each shard to deploy for a Prometheus deployment.
                replicas: 1

                ## Assign custom affinity rules to the prometheus instance
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                          - key: kubernetes.io/os
                            operator: In
                            values:
                              - linux
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 3
                        preference:
                          matchExpressions:
                            - key: project
                              operator: In
                              values:
                                - cluster-ops
                      - weight: 2
                        preference:
                          matchExpressions:
                            - key: environment
                              operator: In
                              values:
                                - critical
                      - weight: 1
                        preference:
                          matchExpressions:
                            - key: eks.amazonaws.com/capacityType
                              operator: In
                              values:
                                - ON_DEMAND

                ## Prometheus StorageSpec for persistent data
                ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/user-guides/storage.md
                # storageSpec:
                #   volumeClaimTemplate:
                #     spec:
                #       accessModes:
                #         - ReadWriteOnce
                #       resources:
                #         requests:
                #           storage: 5Gi

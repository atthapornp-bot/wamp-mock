apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: local
            server: https://kubernetes.default.svc
            clusterName: wamp-nonprod
            awsRegion: ap-southeast-1
            s3Bucket: wamp-nonprod-s3
            serviceAccountRoleArn: "arn:aws:iam::390844743995:role/loki-s3-role"

  template:
    metadata:
      name: "{{name}}-loki"

    spec:
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

      project: cluster-ops

      destination:
        namespace: loki
        server: "{{server}}"

      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: loki
        targetRevision: 6.21.0

        helm:
          releaseName: loki
          values: |
            # Prerequisites:
            # 1. Create S3 bucket for Loki: {{s3Bucket}} (single bucket with prefixes)
            # 2. Create IAM role with S3 access permissions and update the role ARN below
            # 3. Set up IRSA (IAM Roles for Service Accounts) trust relationship

            # There are 3 options:
            # - SingleBinary: Loki is deployed as a single binary, useful for small installs typically without HA, up to a few tens of GB/day.
            # - SimpleScalable: Loki is deployed as 3 targets: read, write, and backend. Useful for medium installs easier to manage than distributed, up to a about 1TB/day.
            # - Distributed: Loki is deployed as individual microservices. The most complicated but most capable, useful for large installs, typically over 1TB/day.
            # There are also 2 additional modes used for migrating between deployment modes:
            # - SingleBinary<->SimpleScalable: Migrate from SingleBinary to SimpleScalable (or vice versa)
            # - SimpleScalable<->Distributed: Migrate from SimpleScalable to Distributed (or vice versa)
            # Note: SimpleScalable and Distributed REQUIRE the use of object storage.
            deploymentMode: SingleBinary

            loki:
              # Should authentication be enabled
              auth_enabled: true

              # Server configuration https://grafana.com/docs/loki/latest/configure/#server
              server:
                http_listen_port: 3100
                grpc_listen_port: 9095
                log_level: info

              # Limits configuration for single tenant with S3 storage https://grafana.com/docs/loki/latest/configure/#limits_config
              limits_config:
                reject_old_samples: true
                reject_old_samples_max_age: 168h
                max_cache_freshness_per_query: 10m
                split_queries_by_interval: 15m
                query_timeout: 300s

                # Global rate limits (est. for 1TB/day ingestion)
                ingestion_rate_mb: 50
                ingestion_burst_size_mb: 150
                max_line_size: 256000

                # Remove per-stream limits for single tenant
                max_streams_per_user: 0
                max_global_streams_per_user: 0

                # Log retention settings - stream-specific rules
                retention_period: 7d  # Default fallback retention
                # Selector is a Prometheus labels matchers that will apply the 'period'
                # retention_stream: |
                #   - selector: {namespace="kube-system"}
                #   period: 3d
                #   - selector: {namespace="loki"}
                #   period: 3d

              # Common configuration
              commonConfig:
                replication_factor: 1

              # Storage configuration with explicit prefixes
              storage:
                type: s3
                bucketNames:
                  # log data storage
                  chunks: {{s3Bucket}}/chunks

                  # alerting rules, recording rules, and ruler state
                  ruler: {{s3Bucket}}/ruler

                  # admin operations and metadata
                  admin: {{s3Bucket}}/admin
                s3:
                  # Use IRSA (IAM Roles for Service Accounts) for authentication
                  region: "{{awsRegion}}"
                  s3ForcePathStyle: false
                  insecure: false
                  # Supported values are: GLACIER,
                  # DEEP_ARCHIVE, GLACIER_IR, INTELLIGENT_TIERING, ONEZONE_IA, OUTPOSTS,
                  # REDUCED_REDUNDANCY, STANDARD, STANDARD_IA.
                  storage_class: "STANDARD"
                  sse:
                    type: "SSE-S3"

              # Schema configuration for S3 storage (fresh start)
              schemaConfig:
                configs:
                  - from: 2025-11-21  # Fresh deployment with S3
                    store: tsdb
                    object_store: s3
                    schema: v13
                    index:
                      prefix: loki_index_
                      period: 24h

              # Compactor configuration for log cleanup
              compactor:
                working_directory: /var/loki/compactor
                compaction_interval: 10m
                retention_enabled: false
                retention_delete_delay: 2h
                retention_delete_worker_count: 150
                # Temporarily disable delete store to fix startup issue
                # delete_request_store: s3
                # delete_request_store_key_prefix: index/
                # delete_request_cancel_period: 24h

              ingester:
                # The algorithm to use for compressing chunk
                chunk_encoding: snappy
                max_chunk_age: 2h
              querier:
                # depend on memory size
                max_concurrent: 2
            test:
              enabled: false
            lokiCanary:
              enabled: false

            # Service account configuration for S3 access
            serviceAccount:
              create: true
              name: loki-s3-sa
              annotations:
                eks.amazonaws.com/role-arn: "{{serviceAccountRoleArn}}"

            # Gateway configuration
            gateway:
              enabled: false

            # Single binary configuration
            singleBinary:
              replicas: 1
              extraEnv:
                # Keep a little bit lower than memory limits
                - name: GOMEMLIMIT
                  value: 1640MiB # 80% of 2Gi
              resources:
                limits:
                  cpu: 1000m
                  memory: 2Gi
                requests:
                  cpu: 500m
                  memory: 1Gi

              # Node affinity to prefer Linux nodes
              nodeSelector:
                kubernetes.io/os: linux

              # Persistence configuration
              persistence:
                enabled: true
                size: 50Gi
                storageClass: "database-gp3"


            # Disable Simple Scalable components for single binary mode
            write:
              replicas: 0
            read:
              replicas: 0
            backend:
              replicas: 0

            # Disable Microservices components for single binary mode
            ingester:
              replicas: 0
            distributor:
              replicas: 0
            querier:
              replicas: 0
            queryFrontend:
              replicas: 0
            queryScheduler:
              replicas: 0
            indexGateway:
              replicas: 0
            compactor:
              replicas: 0
            bloomGateway:
              replicas: 0
            bloomPlanner:
              replicas: 0
            bloomBuilder:
              replicas: 0
            patternIngester:
              replicas: 0
            ruler:
              enabled: false
            memcachedExporter:
              enabled: false

            resultsCache:
              # use memcached for results caching
              enabled: false
              defaultValidity: 12h
              replicas: 1
              persistence:
                # -- Enable creating PVCs for the results-cache
                enabled: false
                # -- Size of persistent disk, must be in G or Gi
                storageSize: 10G
                # -- Storage class to be used.
                storageClass: null
                # -- Volume mount path
                mountPath: /data
            chunksCache:
              # use memcached for chunks caching
              enabled: true
              replicas: 1
              batchSize: 4
              parallelism: 5
              timeout: 100ms
              allocatedMemory: 500 # MB
              writebackSizeLimit: 10MB
              resources:
                limits:
                  cpu: 500m
                  memory: 600Mi
                requests:
                  cpu: 100m
                  memory: 300Mi

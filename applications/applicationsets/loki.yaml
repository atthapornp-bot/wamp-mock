apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: local
            server: https://kubernetes.default.svc
            clusterName: wamp-prod
            awsRegion: ap-southeast-1

  template:
    metadata:
      name: "{{name}}-loki"

    spec:
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

      project: cluster-ops

      destination:
        namespace: loki
        server: "{{server}}"

      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: loki
        targetRevision: 6.21.0

        helm:
          releaseName: loki
          values: |
            # Loki configuration for APISIX logging storage
            # Single tenant mode without authentication - suitable for development/testing
            
            deploymentMode: SingleBinary
            
            loki:
              # Common configuration
              commonConfig:
                replication_factor: 1
              
              # Storage configuration
              storage:
                type: filesystem
                filesystem:
                  chunks_directory: /var/loki/chunks
                  rules_directory: /var/loki/rules
              
              # Schema configuration for log storage
              schemaConfig:
                configs:
                  - from: 2024-04-01
                    store: tsdb
                    object_store: filesystem
                    schema: v13
                    index:
                      prefix: loki_index_
                      period: 24h
              
              # Limits configuration for single tenant
              limits_config:
                reject_old_samples: true
                reject_old_samples_max_age: 168h
                max_cache_freshness_per_query: 10m
                split_queries_by_interval: 15m
                # Global rate limits (no per-user limits in single tenant mode)
                ingestion_rate_mb: 512
                ingestion_burst_size_mb: 1024
                max_line_size: 256000
                # Remove per-stream limits for single tenant
                max_streams_per_user: 0
                max_global_streams_per_user: 0
              
              # Chunk store configuration with cache settings
              chunk_store_config:
                chunk_cache_config:
                  memcached:
                    batch_size: 1024
                    parallelism: 100
                  memcached_client:
                    addresses: loki-chunks-cache:11211
                    timeout: 100ms
                    max_idle_conns: 16
                    update_interval: 1m
                    consistent_hash: true
              
              # Server configuration
              server:
                http_listen_port: 3100
                grpc_listen_port: 9096
                log_level: info
            
            # Single binary configuration
            singleBinary:
              replicas: 1
              resources:
                limits:
                  cpu: 1000m
                  memory: 2Gi
                requests:
                  cpu: 500m
                  memory: 1Gi
              
              # Node affinity to prefer Linux nodes
              nodeSelector:
                kubernetes.io/os: linux
              
              # Persistence configuration
              persistence:
                enabled: true
                size: 50Gi
                storageClass: "database-gp3"
            
            # Chunks cache configuration
            chunksCache:
              enabled: true
              replicas: 1
              image:
                repository: memcached
                tag: 1.6.21-alpine
              resources:
                limits:
                  cpu: 500m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
              allocatedMemory: 768
              port: 11211
              
            # Monitoring configuration
            monitoring:
              serviceMonitor:
                enabled: false
              selfMonitoring:
                enabled: false
                grafanaAgent:
                  installOperator: false
            
            # Test configuration
            test:
              enabled: false
            
            # Disable other components for single binary mode
            backend:
              replicas: 0
            read:
              replicas: 0
            write:
              replicas: 0
            
            # Gateway configuration
            gateway:
              enabled: false
            
            # Ingester configuration (disabled in single binary)
            ingester:
              replicas: 0
            
            # Distributor configuration (disabled in single binary)
            distributor:
              replicas: 0
            
            # Querier configuration (disabled in single binary)
            querier:
              replicas: 0
            
            # Query frontend configuration (disabled in single binary)
            queryFrontend:
              replicas: 0
            
            # Query scheduler configuration (disabled in single binary)
            queryScheduler:
              replicas: 0
            
            # Compactor configuration (disabled in single binary)
            compactor:
              replicas: 0
            
            # Index gateway configuration (disabled in single binary)
            indexGateway:
              replicas: 0
            
            # Bloom compactor configuration (disabled in single binary)
            bloomCompactor:
              replicas: 0
            
            # Bloom gateway configuration (disabled in single binary)
            bloomGateway:
              replicas: 0

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fluent-bit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  generators:
    - list:
        elements:
          - name: local
            server: https://kubernetes.default.svc
            clusterName: wamp-nonprod
            awsRegion: ap-southeast-1

  template:
    metadata:
      name: "{{name}}-fluent-bit"

    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true

      project: cluster-ops

      destination:
        namespace: logging
        server: "{{server}}"

      source:
        repoURL: https://fluent.github.io/helm-charts
        chart: fluent-bit
        targetRevision: "0.50.0"  # Use latest stable version
        helm:
          releaseName: fluent-bit
          values: |
            # DaemonSet ensures FluentBit runs on every node
            kind: DaemonSet
            
            # Resource management - important for production
            resources:
              limits:
                cpu: 200m
                memory: 200Mi
              requests:
                cpu: 100m
                memory: 128Mi
            
            # Service account with necessary permissions
            serviceAccount:
              create: true
            
            # Core FluentBit configuration
            config:
              # Service configuration - defines global behavior
              service: |
                [SERVICE]
                    # Daemon Off means FluentBit runs as a DaemonSet
                    Daemon Off
                    # Flush interval - how often to send logs (in seconds)
                    Flush 5
                    # Set the logging level for Fluent Bit itself
                    Log_Level info
                    # HTTP server for health checks and metrics
                    HTTP_Server On
                    HTTP_Listen 0.0.0.0
                    HTTP_Port 2020
                    # Storage settings for buffering
                    storage.path  /var/log/flb-storage/
                    storage.sync  normal
                    storage.checksum off
                    storage.backlog.mem_limit 50M
              
              # Input plugins - where logs come from
              inputs: |
                [INPUT]
                    # Use the tail input plugin to read container logs
                    Name              tail
                    # Path where Kubernetes stores container logs
                    Path              /var/log/containers/*.log
                    # Exclude Fluent Bit's own logs to prevent circular logging
                    Exclude_Path      /var/log/containers/*fluent-bit*.log
                    # Tag pattern - this creates structured tags for filtering
                    Tag               kube.*
                    # Memory buffer limit per file
                    Mem_Buf_Limit     50MB
                    # Skip long lines instead of failing
                    Skip_Long_Lines   On
                    # Refresh interval for discovering new files
                    Refresh_Interval  10
              
              # Filters - transform and enrich logs
              filters: |
                # First filter: Extract Kubernetes metadata from file paths and container info
                [FILTER]
                    Name                kubernetes
                    Match               kube.*
                    # Location of Kubernetes API
                    Kube_URL            https://kubernetes.default.svc:443
                    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                    # Tag prefix for the kubernetes filter
                    Kube_Tag_Prefix     kube.var.log.containers.
                    # Merge log record with Kubernetes metadata
                    Merge_Log           On
                    # Keep original log field
                    Keep_Log            Off
                    # Add Kubernetes annotations as metadata
                    K8S-Logging.Parser  On
                    K8S-Logging.Exclude On
                    # Add readable labels
                    Labels              On
                    Annotations         On
                    # Buffer size for HTTP requests to K8s API
                    Buffer_Size         32k

                # Second filter: Exclude system containers and namespaces
                [FILTER]
                    Name    grep
                    Match   kube.*
                    # Exclude system namespaces - these contain infrastructure pods
                    Exclude kubernetes_namespace_name ^(kube-system|kube-public|kube-node-lease|logging|istio-system|cert-manager|ingress-nginx)$

                # Third filter: Exclude specific system containers by name patterns
                [FILTER]
                    Name    grep
                    Match   kube.*
                    # Exclude common system containers (pause, proxy, dns, etc.)
                    Exclude kubernetes_container_name ^(pause|kube-proxy|coredns|flannel|calico.*|weave.*|cilium.*|kindnet.*|local-path-provisioner)$
                
                # Fourth filter: Only include containers that have an app-related label
                [FILTER]
                    Name    grep
                    Match   kube.*
                    # Accept pods with either labeling convention
                    # This regex means: match if 'app.kubernetes.io/name' label exists
                    Regex   kubernetes_labels_app.kubernetes.io/name .+
                    
              # Output plugins - where logs go
              outputs: |
                [OUTPUT]
                    Name loki
                    Match kube.*
                    # Loki endpoint configuration
                    uri http://loki.loki:3100/loki/api/v1/push
                    # Labels for log streams - Loki uses labels for indexing
                    labels job=fluent-bit,cluster=${CLUSTER_NAME},namespace=$kubernetes_namespace_name,app=$kubernetes_labels_app,container=$kubernetes_container_name,pod=$kubernetes_pod_name
                    # Remove metadata to reduce log size
                    remove_keys kubernetes_host,kubernetes_pod_id,kubernetes_docker_id,kubernetes_container_hash
                    # Auto kubernetes labels - adds all k8s labels as Loki labels
                    auto_kubernetes_labels on
                    # Tenant ID for multi-tenant Loki setups
                    tenant_id wamp
                    # Line format - how to format the log line
                    line_format json
              
              # Custom parsers for different log formats
              customParsers: |
                [PARSER]
                    Name docker_no_time
                    Format json
                    Time_Keep Off
                    Time_Key time
                    Time_Format %Y-%m-%dT%H:%M:%S.%L
                    
                [PARSER]
                    Name containerd
                    Format regex
                    Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
                    Time_Key time
                    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

            # Environment variables for configuration
            env:
              - name: CLUSTER_NAME
                value: "wamp-nonprod"

            # Tolerations to allow FluentBit to run on all nodes
            # This ensures comprehensive log collection across the entire cluster
            tolerations:
              # Allow scheduling on nodes with NoSchedule taints
              - operator: Exists
                effect: NoSchedule
              # Allow scheduling on nodes with PreferNoSchedule taints  
              - operator: Exists
                effect: PreferNoSchedule
              # Allow scheduling on nodes with NoExecute taints
              - operator: Exists
                effect: NoExecute

            ## @param affinity [object] Affinity for Sealed Secret pods assignment
            ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                          - linux
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 3
                    preference:
                      matchExpressions:
                        - key: project
                          operator: In
                          values:
                            - cluster-ops
                  - weight: 2
                    preference:
                      matchExpressions:
                        - key: environment
                          operator: In
                          values:
                            - critical
                  - weight: 1
                    preference:
                      matchExpressions:
                        - key: eks.amazonaws.com/capacityType
                          operator: In
                          values:
                            - ON_DEMAND

            ## @section Metrics parameters
            metrics:
              ## Prometheus Operator ServiceMonitor configuration
              serviceMonitor:
                ## @param metrics.serviceMonitor.enabled Specify if a ServiceMonitor will be deployed for Prometheus Operator
                enabled: false
                ## @param metrics.serviceMonitor.namespace Namespace where Prometheus Operator is running in
                namespace: kube-prometheus-stack

              ## Grafana dashboards configuration
              dashboards:
                ## @param metrics.dashboards.create Specifies whether a ConfigMap with a Grafana dashboard configuration should be created
                ## ref https://github.com/helm/charts/tree/master/stable/grafana#configuration
                create: false
                ## @param metrics.dashboards.namespace Namespace where Grafana dashboard ConfigMap is deployed
                namespace: kube-prometheus-stack
                ## @param metrics.dashboards.labels Extra labels to be added to the Grafana dashboard ConfigMap
                labels:
                  grafana_dashboard: 1

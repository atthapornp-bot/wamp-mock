apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apisix-system-sops-secrets
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://gitmtl.muangthai.co.th/mtl-digital/mtl-wamp/gitops/kubernetes/cluster-ops.git
        revision: HEAD
        directories:
          - path: cluster-config/local/api-gateway/api-key/*
  template:
    metadata:
      name: 'apisix-system-{{.path.basename}}-sops-secrets'
    spec:
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

      project: cluster-ops
      source:
        repoURL: https://gitmtl.muangthai.co.th/mtl-digital/mtl-wamp/gitops/kubernetes/cluster-ops.git
        path: '{{.path.path}}'
        targetRevision: refs/heads/release/dev
      destination:
        server: "{{server}}"
        namespace: apisix-system
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-ops-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://gitlab.com/muang-thai-life-group/digital-solution/mtl-wamp/gitops/kubernetes/cluster-ops.git
        revision: refs/heads/release/production
        directories:
          - path: cluster-config/local/secrets/*
  template:
    metadata:
      name: "{{.path.basename}}-secrets"
    spec:
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

      project: cluster-ops
      source:
        repoURL: https://gitlab.com/muang-thai-life-group/digital-solution/mtl-wamp/gitops/kubernetes/cluster-ops.git
        path: '{{.path.path}}'
        targetRevision: refs/heads/release/production
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
